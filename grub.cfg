# ZOS GRUB 配置
# GRUB 只用 VGA 控制台（timeout=0 自动启动，无需交互）。
# 串口(COM1)完整保留给内核：QEMU -serial stdio 时它就是内核日志
# 与交互 shell 的通道，不受 GRUB 干扰。
# gfxpayload：让 GRUB 替我们把 VBE 设为 640x480x32（Win3.1 经典分辨率），
# 内核经 Multiboot2 framebuffer 标签拿到帧缓冲信息（无 VBE 时退回文本模式）。
set timeout=0
set default=0

menuentry "ZOS teaching kernel" {
    insmod all_video
    set gfxpayload=640x480x32
    multiboot2 /boot/zos-kernel.elf
    module2 /boot/initrd.tar initrd
    boot
}
